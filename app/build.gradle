plugins {
    id 'com.android.application'
}
android {
    namespace 'com.clown.newhook'
    compileSdk 34
    defaultConfig {
        applicationId "com.clown.newhook"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // 关闭 lint 阻断，方便直接 assembleRelease
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
dependencies {
    // Xposed API（provided，不打进 APK）
    compileOnly 'de.robv.android.xposed:api:82'
}