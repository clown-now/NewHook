plugins {
    id 'com.android.application'
}
android {
    namespace 'com.clown.newhook'
    compileSdk 34
    defaultConfig {
        applicationId "com.clown.newhook"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // 关闭 lint 阻断，方便直接 assembleRelease
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
dependencies {
    // 现代 Xposed API (libxposed) — 最新 102
    compileOnly 'io.github.libxposed:api:102.0.0'
}